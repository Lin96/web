<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>数量金额录入</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --line: #dfe3e8;
      --text: #17212b;
      --muted: #6c7782;
      --accent: #1769e0;
      --accent-dark: #0f56bd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .page {
      width: min(100%, 680px);
      margin: 0 auto;
      padding: 18px 14px 150px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .table-wrap {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
    }

    th {
      color: var(--muted);
      background: #fafbfc;
      font-size: 14px;
      font-weight: 600;
    }

    th:first-child, td:first-child { width: 58%; }
    tr:last-child td { border-bottom: 0; }

    .row-number {
      display: inline-block;
      min-width: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    .entry-input {
      display: block;
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #c9d0d8;
      border-radius: 5px;
      outline: 0;
      color: var(--text);
      background: #fff;
      font: inherit;
      font-size: 17px;
      -webkit-appearance: none;
    }

    .entry-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 105, 224, .14);
    }

    .entry-cell {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .ocr-panel {
      margin-bottom: 12px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .ocr-title {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 650;
    }

    .ocr-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 5px;
      color: #fff;
      background: var(--accent);
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .file-button:active { background: var(--accent-dark); }
    .file-button.is-loading { opacity: .55; cursor: wait; }
    .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    .ocr-hint {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .ocr-status {
      flex: 1;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .ocr-status.is-error { color: #c0392b; }
    .ocr-status.is-success { color: #138a61; }

    .summary {
      display: block;
      margin-top: 14px;
    }

    .summary-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
      padding: 12px 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .summary-label {
      display: inline;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .summary-value {
      display: inline;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }

    .action-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 2;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, .96);
      border-top: 1px solid var(--line);
      box-shadow: 0 -3px 12px rgba(23, 33, 43, .06);
    }

    .actions {
      display: flex;
      gap: 10px;
      width: min(100%, 680px);
      margin: 0 auto;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 5px;
      padding: 0 18px;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }

    #confirm-button {
      flex: 1;
      color: #fff;
      background: var(--accent);
    }

    #confirm-button:active { background: var(--accent-dark); }

    #clear-button {
      color: var(--text);
      background: #e9edf2;
    }

    @media (max-width: 600px) {
      .page { padding: 10px 8px 122px; }
      h1 { margin-bottom: 8px; font-size: 19px; }
      th, td { padding: 5px 6px; }
      th { font-size: 13px; }
      .row-number { min-width: 18px; font-size: 12px; }
      .entry-input {
        min-height: 36px;
        padding: 5px 7px;
        font-size: 16px;
      }
      .ocr-panel { margin-bottom: 8px; padding: 9px 8px; }
      .ocr-controls { align-items: flex-start; flex-direction: column; }
      .ocr-status { width: 100%; }
      .summary { margin-top: 8px; }
      .summary-item { gap: 5px; padding: 8px 6px; }
      .summary-label { font-size: 12px; }
      .summary-value { font-size: 15px; }
      .action-bar { padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
      .actions { gap: 6px; }
      button { min-height: 40px; padding: 0 13px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- <h1>数量金额录入</h1> -->

    <section class="ocr-panel" aria-labelledby="ocr-title">
      <h2 class="ocr-title" id="ocr-title">识别图片填表</h2>
      <div class="ocr-controls">
        <label class="file-button" id="file-button" for="image-file">上传图片并识别</label>
        <input class="file-input" id="image-file" type="file" accept="image/*">
        <span class="ocr-status" id="ocr-status" aria-live="polite">图片第 1 列填金额，第 2 列填数量</span>
      </div>
      <p class="ocr-hint">选择图片后自动识别，并从表格第 1 行开始填入。</p>
    </section>

    <div class="table-wrap">
      <table aria-label="金额数量录入表">
        <thead>
          <tr><th>金额</th><th>数量</th></tr>
        </thead>
        <tbody id="entry-body"></tbody>
      </table>
    </div>

    <section class="summary" aria-live="polite">
      <div class="summary-item">
        <span class="summary-label">平均金额</span>
        <strong class="summary-value" id="average-amount">0.000</strong>
        <span class="summary-label">×1.015</span>
        <strong class="summary-value" id="adjusted-average">0.000</strong>
      </div>
    </section>
  </main>

  <div class="action-bar">
    <div class="actions">
      <button type="button" id="clear-button">清空</button>
      <button type="button" id="confirm-button">确定并下一格</button>
    </div>
  </div>

  <script>
    (function () {
      var ROW_COUNT = 12;
      var body = document.getElementById('entry-body');
      var confirmButton = document.getElementById('confirm-button');
      var clearButton = document.getElementById('clear-button');
      var imageFile = document.getElementById('image-file');
      var fileButton = document.getElementById('file-button');
      var ocrStatus = document.getElementById('ocr-status');
      var ocrWorker = null;
      var fields = [];
      var activeFieldIndex = 0;

      for (var i = 0; i < ROW_COUNT; i += 1) {
        var row = document.createElement('tr');
        row.innerHTML = '<td><div class="entry-cell"><span class="row-number">' + (i + 1) + '</span>' +
          '<input class="entry-input" type="text" inputmode="decimal" autocomplete="off" aria-label="第 ' + (i + 1) + ' 行金额"></div></td>' +
          '<td><input class="entry-input" type="text" inputmode="decimal" autocomplete="off" aria-label="第 ' + (i + 1) + ' 行数量"></td>';
        body.appendChild(row);
        var inputs = row.querySelectorAll('input');
        fields.push(inputs[0], inputs[1]);
      }

      function round3(value) {
        return Math.round((value + Number.EPSILON) * 1000) / 1000;
      }

      function parseValue(input) {
        var value = parseFloat(input.value.replace(/,/g, ''));
        return Number.isFinite(value) ? value : 0;
      }

      function updateSummary() {
        var totalQuantity = 0;
        var totalAmount = 0;
        for (var i = 0; i < fields.length; i += 2) {
          var amount = parseValue(fields[i]);
          var quantity = parseValue(fields[i + 1]);
          totalQuantity += quantity;
          totalAmount += quantity * amount;
        }
        totalQuantity = round3(totalQuantity);
        totalAmount = round3(totalAmount);
        var average = totalQuantity === 0 ? 0 : round3(totalAmount / totalQuantity);
        var adjustedAverage = round3(average * 1.015);
        document.getElementById('average-amount').textContent = average.toFixed(3);
        document.getElementById('adjusted-average').textContent = adjustedAverage.toFixed(3);
      }

      function normalizeAmount(input) {
        if (input.value.trim() === '') return;
        var value = parseFloat(input.value.replace(/,/g, ''));
        if (Number.isFinite(value)) input.value = round3(value).toFixed(3);
      }

      function setOcrStatus(message, type) {
        ocrStatus.textContent = message;
        ocrStatus.className = 'ocr-status' + (type ? ' is-' + type : '');
      }

      function loadOcrLibrary() {
        if (window.Tesseract) return Promise.resolve();
        return new Promise(function (resolve, reject) {
          var existing = document.getElementById('tesseract-script');
          if (existing) {
            existing.addEventListener('load', resolve, { once: true });
            existing.addEventListener('error', reject, { once: true });
            return;
          }
          var script = document.createElement('script');
          script.id = 'tesseract-script';
          script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
          script.onload = resolve;
          script.onerror = function (error) {
            script.remove();
            reject(error);
          };
          document.head.appendChild(script);
        });
      }

      function getRecognitionCanvas(image) {
        var sourceWidth = image.naturalWidth;
        var sourceHeight = image.naturalHeight;
        var maxWidth = 1800;
        var maxHeight = 8000;
        var scale = Math.min(2, maxWidth / sourceWidth, maxHeight / sourceHeight);
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(sourceWidth * scale));
        canvas.height = Math.max(1, Math.round(sourceHeight * scale));
        var context = canvas.getContext('2d', { willReadFrequently: true });
        context.drawImage(image, 0, 0, sourceWidth, sourceHeight, 0, 0, canvas.width, canvas.height);

        var pixels = context.getImageData(0, 0, canvas.width, canvas.height);
        for (var i = 0; i < pixels.data.length; i += 4) {
          var gray = pixels.data[i] * .299 + pixels.data[i + 1] * .587 + pixels.data[i + 2] * .114;
          var contrasted = gray < 165 ? Math.max(0, gray * .72) : Math.min(255, gray * 1.13);
          pixels.data[i] = contrasted;
          pixels.data[i + 1] = contrasted;
          pixels.data[i + 2] = contrasted;
        }
        context.putImageData(pixels, 0, 0);
        return canvas;
      }

      function extractRecognitionRows(text) {
        var rows = [];
        String(text || '').replace(/，/g, ',').replace(/[。·]/g, '.').split(/\r?\n/).forEach(function (line) {
          var matches = line.match(/-?(?:\d[\d,]*\.?\d*|\.\d+)/g) || [];
          var values = matches.map(function (value) { return value.replace(/,$/, ''); }).filter(function (value) {
            return value && Number.isFinite(Number(value.replace(/,/g, '')));
          });
          if (values.length >= 2) rows.push({ amount: values[0], quantity: values[1] });
        });
        return rows;
      }

      async function getOcrWorker() {
        await loadOcrLibrary();
        if (!ocrWorker) {
          ocrWorker = await window.Tesseract.createWorker('eng', 1, {
            logger: function (message) {
              if (message.status === 'recognizing text') {
                setOcrStatus('正在识别 ' + Math.round(message.progress * 100) + '%');
              } else if (message.status) {
                setOcrStatus('正在准备识别组件…');
              }
            }
          });
          await ocrWorker.setParameters({
            tessedit_char_whitelist: '0123456789.,-',
            tessedit_pageseg_mode: '6',
            preserve_interword_spaces: '1'
          });
        }
        return ocrWorker;
      }

      function loadImage(file) {
        return new Promise(function (resolve, reject) {
          var imageUrl = URL.createObjectURL(file);
          var image = new Image();
          image.onload = function () {
            URL.revokeObjectURL(imageUrl);
            resolve(image);
          };
          image.onerror = function () {
            URL.revokeObjectURL(imageUrl);
            reject(new Error('图片加载失败'));
          };
          image.src = imageUrl;
        });
      }

      async function recognizeAndFill(file) {
        imageFile.disabled = true;
        fileButton.classList.add('is-loading');
        fileButton.textContent = '正在识别…';
        setOcrStatus('正在加载识别组件…');
        try {
          var image = await loadImage(file);
          var worker = await getOcrWorker();
          var result = await worker.recognize(getRecognitionCanvas(image));
          var rows = extractRecognitionRows(result.data.text);
          if (!rows.length) {
            setOcrStatus('没有识别到完整的两列数字，请选择更清晰的图片重试', 'error');
            return;
          }
          applyRecognizedValues(rows);
        } catch (error) {
          setOcrStatus('识别失败，请检查网络连接后重试', 'error');
          console.error(error);
        } finally {
          imageFile.disabled = false;
          imageFile.value = '';
          fileButton.classList.remove('is-loading');
          fileButton.textContent = '上传图片并识别';
        }
      }

      function applyRecognizedValues(rows) {
        var fillCount = Math.min(rows.length, ROW_COUNT);
        for (var i = 0; i < fillCount; i += 1) {
          var amountField = fields[i * 2];
          var quantityField = fields[i * 2 + 1];
          amountField.value = rows[i].amount.replace(/,/g, '');
          quantityField.value = rows[i].quantity.replace(/,/g, '');
          normalizeAmount(amountField);
        }
        updateSummary();
        setOcrStatus('识别完成：第 1 列已填金额，第 2 列已填数量，共填入 ' + fillCount + ' 行' + (rows.length > fillCount ? '，其余 ' + (rows.length - fillCount) + ' 行超出表格未填入' : ''), 'success');
      }

      function focusNext() {
        var current = document.activeElement;
        var index = fields.indexOf(current);
        if (index < 0) index = activeFieldIndex;
        if (current && current.type === 'text' && index % 2 === 0) normalizeAmount(current);
        updateSummary();
        if (index + 1 < fields.length) {
          activeFieldIndex = index + 1;
          fields[index + 1].focus();
          fields[index + 1].select();
        } else {
          current.blur();
        }
      }

      fields.forEach(function (input, index) {
        input.addEventListener('focus', function () { activeFieldIndex = index; });
        input.addEventListener('input', updateSummary);
        input.addEventListener('blur', function () {
          if (index % 2 === 0) normalizeAmount(input);
          updateSummary();
        });
        input.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === 'Tab') {
            event.preventDefault();
            focusNext();
          }
        });
      });

      confirmButton.addEventListener('click', focusNext);
      imageFile.addEventListener('change', function () {
        var file = imageFile.files && imageFile.files[0];
        if (!file) return;
        if (!file.type.match(/^image\//)) {
          setOcrStatus('请选择图片文件', 'error');
          imageFile.value = '';
          return;
        }
        recognizeAndFill(file);
      });
      clearButton.addEventListener('click', function () {
        fields.forEach(function (input) { input.value = ''; });
        updateSummary();
        fields[0].focus();
      });
      window.addEventListener('beforeunload', function () {
        if (ocrWorker) ocrWorker.terminate();
      });

      updateSummary();
    }());
  </script>
</body>
</html>
