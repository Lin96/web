<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>数量金额录入</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --line: #dfe3e8;
      --text: #17212b;
      --muted: #6c7782;
      --accent: #1769e0;
      --accent-dark: #0f56bd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .page {
      width: min(100%, 680px);
      margin: 0 auto;
      padding: 18px 14px 150px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .table-wrap {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
    }

    th {
      color: var(--muted);
      background: #fafbfc;
      font-size: 14px;
      font-weight: 600;
    }

    th:first-child, td:first-child { width: 58%; }
    tr:last-child td { border-bottom: 0; }

    .row-number {
      display: inline-block;
      min-width: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    .entry-input {
      display: block;
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #c9d0d8;
      border-radius: 5px;
      outline: 0;
      color: var(--text);
      background: #fff;
      font: inherit;
      font-size: 17px;
      -webkit-appearance: none;
    }

    .entry-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 105, 224, .14);
    }

    .entry-cell {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .ocr-panel {
      margin-bottom: 12px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .ocr-title {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 650;
    }

    .ocr-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 5px;
      color: #fff;
      background: var(--accent);
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .file-button:active { background: var(--accent-dark); }
    .file-button.is-loading { opacity: .55; cursor: wait; }
    .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    .ocr-hint {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .crop-editor {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      color: #fff;
      background: #111;
    }

    .crop-editor.is-visible { display: flex; }

    body.is-cropping { overflow: hidden; }

    .crop-header {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 72px 1fr 72px;
      align-items: center;
      min-height: calc(54px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 8px 0;
      background: #181818;
    }

    .crop-title {
      margin: 0;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
    }

    .crop-header-button {
      min-width: 0;
      min-height: 44px;
      padding: 0 10px;
      color: #fff;
      background: transparent;
      font-size: 16px;
    }

    #cancel-crop-button { justify-self: start; }
    #crop-recognize-button {
      justify-self: end;
      color: #67a6ff;
      font-weight: 650;
    }

    .crop-header-button:active { opacity: .65; }
    .crop-header-button:disabled { opacity: .45; cursor: wait; }

    .crop-canvas {
      position: relative;
      flex: 1;
      overflow: hidden;
      width: 100%;
      min-height: 0;
      background: #080808;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: crosshair;
    }

    .crop-canvas.is-moving { cursor: grabbing; }
    .crop-canvas.is-resizing { cursor: default; }
    .crop-canvas.is-drawing { cursor: crosshair; }

    .crop-image {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      max-width: none;
      transform-origin: 0 0;
      pointer-events: none;
      will-change: transform;
    }

    .crop-image.is-ready { display: block; }
    .crop-box {
      position: absolute;
      z-index: 1;
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, .62);
      cursor: move;
      pointer-events: auto;
      touch-action: none;
      will-change: left, top, width, height;
    }

    .crop-box::before,
    .crop-box::after {
      position: absolute;
      content: "";
      opacity: .28;
      transition: opacity 160ms ease;
    }

    .crop-canvas.is-adjusting .crop-box::before,
    .crop-canvas.is-adjusting .crop-box::after { opacity: .58; }

    .crop-box::before {
      top: 33.333%;
      right: 0;
      bottom: 33.333%;
      left: 0;
      border-top: 1px solid #fff;
      border-bottom: 1px solid #fff;
    }

    .crop-box::after {
      top: 0;
      right: 33.333%;
      bottom: 0;
      left: 33.333%;
      border-right: 1px solid #fff;
      border-left: 1px solid #fff;
    }

    .crop-handle {
      position: absolute;
      z-index: 2;
      display: block;
      pointer-events: auto;
      touch-action: none;
    }

    .crop-handle::after {
      position: absolute;
      content: "";
    }

    .crop-handle[data-handle="nw"],
    .crop-handle[data-handle="ne"],
    .crop-handle[data-handle="sw"],
    .crop-handle[data-handle="se"] {
      width: 44px;
      height: 44px;
    }

    .crop-handle[data-handle="nw"] { top: 0; left: 0; transform: translate(-50%, -50%); cursor: nwse-resize; }
    .crop-handle[data-handle="ne"] { top: 0; right: 0; transform: translate(50%, -50%); cursor: nesw-resize; }
    .crop-handle[data-handle="sw"] { bottom: 0; left: 0; transform: translate(-50%, 50%); cursor: nesw-resize; }
    .crop-handle[data-handle="se"] { right: 0; bottom: 0; transform: translate(50%, 50%); cursor: nwse-resize; }

    .crop-handle[data-handle="nw"]::after,
    .crop-handle[data-handle="ne"]::after,
    .crop-handle[data-handle="sw"]::after,
    .crop-handle[data-handle="se"]::after {
      width: 18px;
      height: 18px;
      border-color: #fff;
      border-style: solid;
    }

    .crop-handle[data-handle="nw"]::after { right: 3px; bottom: 3px; border-width: 3px 0 0 3px; }
    .crop-handle[data-handle="ne"]::after { bottom: 3px; left: 3px; border-width: 3px 3px 0 0; }
    .crop-handle[data-handle="sw"]::after { top: 3px; right: 3px; border-width: 0 0 3px 3px; }
    .crop-handle[data-handle="se"]::after { top: 3px; left: 3px; border-width: 0 3px 3px 0; }

    .crop-handle[data-handle="n"],
    .crop-handle[data-handle="s"] {
      left: 44px;
      width: calc(100% - 88px);
      min-width: 12px;
      height: 32px;
      cursor: ns-resize;
    }

    .crop-handle[data-handle="n"] { top: 0; transform: translateY(-50%); }
    .crop-handle[data-handle="s"] { bottom: 0; transform: translateY(50%); }

    .crop-handle[data-handle="e"],
    .crop-handle[data-handle="w"] {
      top: 44px;
      width: 32px;
      height: calc(100% - 88px);
      min-height: 12px;
      cursor: ew-resize;
    }

    .crop-handle[data-handle="e"] { right: 0; transform: translateX(50%); }
    .crop-handle[data-handle="w"] { left: 0; transform: translateX(-50%); }

    .ocr-status {
      flex: 1;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .ocr-status.is-error { color: #c0392b; }
    .ocr-status.is-success { color: #138a61; }

    .summary {
      display: block;
      margin-top: 14px;
    }

    .summary-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
      padding: 12px 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .summary-label {
      display: inline;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .summary-value {
      display: inline;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }

    .action-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 2;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, .96);
      border-top: 1px solid var(--line);
      box-shadow: 0 -3px 12px rgba(23, 33, 43, .06);
    }

    .actions {
      display: flex;
      gap: 10px;
      width: min(100%, 680px);
      margin: 0 auto;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 5px;
      padding: 0 18px;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }

    #confirm-button {
      flex: 1;
      color: #fff;
      background: var(--accent);
    }

    #confirm-button:active { background: var(--accent-dark); }

    #clear-button {
      color: var(--text);
      background: #e9edf2;
    }

    @media (max-width: 600px) {
      .page { padding: 10px 8px 122px; }
      h1 { margin-bottom: 8px; font-size: 19px; }
      th, td { padding: 5px 6px; }
      th { font-size: 13px; }
      .row-number { min-width: 18px; font-size: 12px; }
      .entry-input {
        min-height: 36px;
        padding: 5px 7px;
        font-size: 16px;
      }
      .ocr-panel { margin-bottom: 8px; padding: 9px 8px; }
      .ocr-controls { align-items: flex-start; flex-direction: column; }
      .ocr-status { width: 100%; }
      .summary { margin-top: 8px; }
      .summary-item { gap: 5px; padding: 8px 6px; }
      .summary-label { font-size: 12px; }
      .summary-value { font-size: 15px; }
      .action-bar { padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
      .actions { gap: 6px; }
      button { min-height: 40px; padding: 0 13px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- <h1>数量金额录入</h1> -->

    <section class="ocr-panel" aria-labelledby="ocr-title">
      <h2 class="ocr-title" id="ocr-title">识别图片填表</h2>
      <div class="ocr-controls">
        <label class="file-button" id="file-button" for="image-file">选择图片</label>
        <input class="file-input" id="image-file" type="file" accept="image/*">
        <span class="ocr-status" id="ocr-status" aria-live="polite">图片第 1 列填金额，第 2 列填数量</span>
      </div>
      <p class="ocr-hint">选择图片后，框住要识别的两列数据，完成裁剪后自动识别。</p>
      <div class="crop-editor" id="crop-editor" role="dialog" aria-modal="true" aria-labelledby="crop-title">
        <header class="crop-header">
          <button class="crop-header-button" type="button" id="cancel-crop-button">取消</button>
          <h2 class="crop-title" id="crop-title">裁剪图片</h2>
          <button class="crop-header-button" type="button" id="crop-recognize-button">完成</button>
        </header>
        <div class="crop-canvas" id="crop-canvas">
          <img class="crop-image" id="crop-image" alt="待裁剪的图片">
          <div class="crop-box" id="crop-box" aria-label="图片裁剪区域">
            <span class="crop-handle" data-handle="nw"></span>
            <span class="crop-handle" data-handle="n"></span>
            <span class="crop-handle" data-handle="ne"></span>
            <span class="crop-handle" data-handle="e"></span>
            <span class="crop-handle" data-handle="sw"></span>
            <span class="crop-handle" data-handle="s"></span>
            <span class="crop-handle" data-handle="se"></span>
            <span class="crop-handle" data-handle="w"></span>
          </div>
        </div>
      </div>
    </section>

    <div class="table-wrap">
      <table aria-label="金额数量录入表">
        <thead>
          <tr><th>金额</th><th>数量</th></tr>
        </thead>
        <tbody id="entry-body"></tbody>
      </table>
    </div>

    <section class="summary" aria-live="polite">
      <div class="summary-item">
        <span class="summary-label">平均金额</span>
        <strong class="summary-value" id="average-amount">0.000</strong>
        <span class="summary-label">×1.015</span>
        <strong class="summary-value" id="adjusted-average">0.000</strong>
      </div>
    </section>
  </main>

  <div class="action-bar">
    <div class="actions">
      <button type="button" id="clear-button">清空</button>
      <button type="button" id="confirm-button">确定并下一格</button>
    </div>
  </div>

  <script>
    (function () {
      var ROW_COUNT = 12;
      var body = document.getElementById('entry-body');
      var confirmButton = document.getElementById('confirm-button');
      var clearButton = document.getElementById('clear-button');
      var imageFile = document.getElementById('image-file');
      var fileButton = document.getElementById('file-button');
      var ocrStatus = document.getElementById('ocr-status');
      var cropEditor = document.getElementById('crop-editor');
      var cropCanvas = document.getElementById('crop-canvas');
      var cropImage = document.getElementById('crop-image');
      var cropBox = document.getElementById('crop-box');
      var cropRecognizeButton = document.getElementById('crop-recognize-button');
      var cancelCropButton = document.getElementById('cancel-crop-button');
      var ocrWorker = null;
      var fields = [];
      var activeFieldIndex = 0;
      var selectedImage = null;
      var cropImageUrl = '';
      var crop = { x: 0, y: 0, width: 0, height: 0 };
      var cropFrame = { x: 0, y: 0, width: 0, height: 0 };
      var imageTransform = { x: 0, y: 0, scale: 1 };
      var cropGesture = null;
      var CROP_MARGIN = 18;
      var MIN_CROP_SIZE = 56;

      for (var i = 0; i < ROW_COUNT; i += 1) {
        var row = document.createElement('tr');
        row.innerHTML = '<td><div class="entry-cell"><span class="row-number">' + (i + 1) + '</span>' +
          '<input class="entry-input" type="text" inputmode="decimal" autocomplete="off" aria-label="第 ' + (i + 1) + ' 行金额"></div></td>' +
          '<td><input class="entry-input" type="text" inputmode="decimal" autocomplete="off" aria-label="第 ' + (i + 1) + ' 行数量"></td>';
        body.appendChild(row);
        var inputs = row.querySelectorAll('input');
        fields.push(inputs[0], inputs[1]);
      }

      function round3(value) {
        return Math.round((value + Number.EPSILON) * 1000) / 1000;
      }

      function parseValue(input) {
        var value = parseFloat(input.value.replace(/,/g, ''));
        return Number.isFinite(value) ? value : 0;
      }

      function updateSummary() {
        var totalQuantity = 0;
        var totalAmount = 0;
        for (var i = 0; i < fields.length; i += 2) {
          var amount = parseValue(fields[i]);
          var quantity = parseValue(fields[i + 1]);
          totalQuantity += quantity;
          totalAmount += quantity * amount;
        }
        totalQuantity = round3(totalQuantity);
        totalAmount = round3(totalAmount);
        var average = totalQuantity === 0 ? 0 : round3(totalAmount / totalQuantity);
        var adjustedAverage = round3(average * 1.015);
        document.getElementById('average-amount').textContent = average.toFixed(3);
        document.getElementById('adjusted-average').textContent = adjustedAverage.toFixed(3);
      }

      function normalizeAmount(input) {
        if (input.value.trim() === '') return;
        var value = parseFloat(input.value.replace(/,/g, ''));
        if (Number.isFinite(value)) input.value = round3(value).toFixed(3);
      }

      function setOcrStatus(message, type) {
        ocrStatus.textContent = message;
        ocrStatus.className = 'ocr-status' + (type ? ' is-' + type : '');
      }

      function loadOcrLibrary() {
        if (window.Tesseract) return Promise.resolve();
        return new Promise(function (resolve, reject) {
          var existing = document.getElementById('tesseract-script');
          if (existing) {
            existing.addEventListener('load', resolve, { once: true });
            existing.addEventListener('error', reject, { once: true });
            return;
          }
          var script = document.createElement('script');
          script.id = 'tesseract-script';
          script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
          script.onload = resolve;
          script.onerror = function (error) {
            script.remove();
            reject(error);
          };
          document.head.appendChild(script);
        });
      }

      function getRecognitionCanvas(image, cropRect) {
        var sourceX = cropRect ? Math.max(0, Math.round(cropRect.x)) : 0;
        var sourceY = cropRect ? Math.max(0, Math.round(cropRect.y)) : 0;
        var sourceWidth = cropRect ? Math.round(cropRect.width) : image.naturalWidth;
        var sourceHeight = cropRect ? Math.round(cropRect.height) : image.naturalHeight;
        sourceWidth = Math.max(1, Math.min(sourceWidth, image.naturalWidth - sourceX));
        sourceHeight = Math.max(1, Math.min(sourceHeight, image.naturalHeight - sourceY));
        var maxWidth = 1800;
        var maxHeight = 8000;
        var scale = Math.min(2, maxWidth / sourceWidth, maxHeight / sourceHeight);
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(sourceWidth * scale));
        canvas.height = Math.max(1, Math.round(sourceHeight * scale));
        var context = canvas.getContext('2d', { willReadFrequently: true });
        context.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, canvas.width, canvas.height);

        var pixels = context.getImageData(0, 0, canvas.width, canvas.height);
        for (var i = 0; i < pixels.data.length; i += 4) {
          var gray = pixels.data[i] * .299 + pixels.data[i + 1] * .587 + pixels.data[i + 2] * .114;
          var contrasted = gray < 165 ? Math.max(0, gray * .72) : Math.min(255, gray * 1.13);
          pixels.data[i] = contrasted;
          pixels.data[i + 1] = contrasted;
          pixels.data[i + 2] = contrasted;
        }
        context.putImageData(pixels, 0, 0);
        return canvas;
      }

      function renderCropFrame() {
        cropBox.style.left = cropFrame.x + 'px';
        cropBox.style.top = cropFrame.y + 'px';
        cropBox.style.width = cropFrame.width + 'px';
        cropBox.style.height = cropFrame.height + 'px';
      }

      function renderCropImage() {
        cropImage.style.transform = 'translate3d(' + imageTransform.x + 'px,' + imageTransform.y + 'px,0) scale(' + imageTransform.scale + ')';
      }

      function clearCropImage() {
        if (cropImageUrl) URL.revokeObjectURL(cropImageUrl);
        cropImageUrl = '';
        cropImage.classList.remove('is-ready');
        cropImage.removeAttribute('src');
      }

      function getImageBounds() {
        return {
          x: imageTransform.x,
          y: imageTransform.y,
          width: selectedImage.naturalWidth * imageTransform.scale,
          height: selectedImage.naturalHeight * imageTransform.scale
        };
      }

      function layoutCropEditor(resetImage) {
        if (!selectedImage || !cropCanvas.clientWidth || !cropCanvas.clientHeight) return;
        var sourceCrop = !resetImage && cropFrame.width ? getSourceCrop() : null;
        var availableWidth = Math.max(1, cropCanvas.clientWidth - CROP_MARGIN * 2);
        var availableHeight = Math.max(1, cropCanvas.clientHeight - CROP_MARGIN * 2);
        imageTransform.scale = Math.min(
          availableWidth / selectedImage.naturalWidth,
          availableHeight / selectedImage.naturalHeight
        );
        imageTransform.x = (cropCanvas.clientWidth - selectedImage.naturalWidth * imageTransform.scale) / 2;
        imageTransform.y = (cropCanvas.clientHeight - selectedImage.naturalHeight * imageTransform.scale) / 2;

        if (sourceCrop) {
          cropFrame = {
            x: imageTransform.x + sourceCrop.x * imageTransform.scale,
            y: imageTransform.y + sourceCrop.y * imageTransform.scale,
            width: sourceCrop.width * imageTransform.scale,
            height: sourceCrop.height * imageTransform.scale
          };
        } else {
          var imageBounds = getImageBounds();
          var inset = Math.min(48, imageBounds.width * .12, imageBounds.height * .12);
          cropFrame = {
            x: imageBounds.x + inset,
            y: imageBounds.y + inset,
            width: Math.max(1, imageBounds.width - inset * 2),
            height: Math.max(1, imageBounds.height - inset * 2)
          };
        }
        renderCropImage();
        renderCropFrame();
      }

      function getPointerPosition(event) {
        var bounds = cropCanvas.getBoundingClientRect();
        return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
      }

      function clamp(value, minimum, maximum) {
        return Math.max(minimum, Math.min(maximum, value));
      }

      function copyCropFrame() {
        return {
          x: cropFrame.x,
          y: cropFrame.y,
          width: cropFrame.width,
          height: cropFrame.height
        };
      }

      function resizeCropFrame(pointer) {
        var handle = cropGesture.handle;
        var frame = cropGesture.frame;
        var bounds = getImageBounds();
        var left = frame.x;
        var top = frame.y;
        var right = frame.x + frame.width;
        var bottom = frame.y + frame.height;
        var deltaX = pointer.x - cropGesture.startX;
        var deltaY = pointer.y - cropGesture.startY;
        var maximumRight = bounds.x + bounds.width;
        var maximumBottom = bounds.y + bounds.height;
        var minimumWidth = Math.min(MIN_CROP_SIZE, bounds.width);
        var minimumHeight = Math.min(MIN_CROP_SIZE, bounds.height);

        if (handle.indexOf('w') !== -1) left = clamp(frame.x + deltaX, bounds.x, right - minimumWidth);
        if (handle.indexOf('e') !== -1) right = clamp(frame.x + frame.width + deltaX, left + minimumWidth, maximumRight);
        if (handle.indexOf('n') !== -1) top = clamp(frame.y + deltaY, bounds.y, bottom - minimumHeight);
        if (handle.indexOf('s') !== -1) bottom = clamp(frame.y + frame.height + deltaY, top + minimumHeight, maximumBottom);

        cropFrame.x = left;
        cropFrame.y = top;
        cropFrame.width = right - left;
        cropFrame.height = bottom - top;
        renderCropFrame();
      }

      function moveCropFrame(pointer) {
        var bounds = getImageBounds();
        var frame = cropGesture.frame;
        cropFrame.x = clamp(
          frame.x + pointer.x - cropGesture.startX,
          bounds.x,
          bounds.x + bounds.width - frame.width
        );
        cropFrame.y = clamp(
          frame.y + pointer.y - cropGesture.startY,
          bounds.y,
          bounds.y + bounds.height - frame.height
        );
        renderCropFrame();
      }

      function drawCropFrame(pointer) {
        var bounds = getImageBounds();
        var x = clamp(pointer.x, bounds.x, bounds.x + bounds.width);
        var y = clamp(pointer.y, bounds.y, bounds.y + bounds.height);
        cropFrame.x = Math.min(cropGesture.startX, x);
        cropFrame.y = Math.min(cropGesture.startY, y);
        cropFrame.width = Math.max(1, Math.abs(x - cropGesture.startX));
        cropFrame.height = Math.max(1, Math.abs(y - cropGesture.startY));
        renderCropFrame();
      }

      function ensureMinimumCropSize() {
        var bounds = getImageBounds();
        var width = Math.min(Math.max(cropFrame.width, MIN_CROP_SIZE), bounds.width);
        var height = Math.min(Math.max(cropFrame.height, MIN_CROP_SIZE), bounds.height);
        var centerX = cropFrame.x + cropFrame.width / 2;
        var centerY = cropFrame.y + cropFrame.height / 2;
        cropFrame.width = width;
        cropFrame.height = height;
        cropFrame.x = clamp(centerX - width / 2, bounds.x, bounds.x + bounds.width - width);
        cropFrame.y = clamp(centerY - height / 2, bounds.y, bounds.y + bounds.height - height);
        renderCropFrame();
      }

      function startCropAction(event) {
        if (!selectedImage || cropGesture || (event.pointerType === 'mouse' && event.button !== 0)) return;
        var handleElement = event.target.closest && event.target.closest('.crop-handle');
        var handle = handleElement ? handleElement.getAttribute('data-handle') : '';
        var point = getPointerPosition(event);
        var boxElement = event.target.closest && event.target.closest('.crop-box');
        var bounds = getImageBounds();
        if (!handle && !boxElement &&
            (point.x < bounds.x || point.x > bounds.x + bounds.width ||
             point.y < bounds.y || point.y > bounds.y + bounds.height)) return;

        cropGesture = {
          type: handle ? 'resize' : (boxElement ? 'move' : 'draw'),
          handle: handle,
          pointerId: event.pointerId,
          startX: point.x,
          startY: point.y,
          frame: copyCropFrame()
        };
        if (cropGesture.type === 'draw') {
          cropFrame = { x: point.x, y: point.y, width: 1, height: 1 };
          renderCropFrame();
        }
        cropCanvas.classList.add('is-adjusting');
        cropCanvas.classList.add(cropGesture.type === 'move'
          ? 'is-moving'
          : (cropGesture.type === 'draw' ? 'is-drawing' : 'is-resizing'));
        cropCanvas.setPointerCapture(event.pointerId);
        event.preventDefault();
      }

      function moveCropAction(event) {
        if (!cropGesture || event.pointerId !== cropGesture.pointerId) return;
        var point = getPointerPosition(event);
        if (cropGesture.type === 'resize') resizeCropFrame(point);
        if (cropGesture.type === 'move') moveCropFrame(point);
        if (cropGesture.type === 'draw') drawCropFrame(point);
        event.preventDefault();
      }

      function endCropAction(event) {
        if (!cropGesture || event.pointerId !== cropGesture.pointerId) return;
        var endingGesture = cropGesture;
        cropGesture = null;
        cropCanvas.classList.remove('is-moving', 'is-resizing', 'is-drawing', 'is-adjusting');
        if (event.type === 'pointercancel') {
          cropFrame = endingGesture.frame;
          renderCropFrame();
        } else if (endingGesture.type === 'draw') {
          ensureMinimumCropSize();
        }
        if (cropCanvas.hasPointerCapture(event.pointerId)) cropCanvas.releasePointerCapture(event.pointerId);
      }

      function getSourceCrop() {
        var x = clamp((cropFrame.x - imageTransform.x) / imageTransform.scale, 0, selectedImage.naturalWidth);
        var y = clamp((cropFrame.y - imageTransform.y) / imageTransform.scale, 0, selectedImage.naturalHeight);
        return {
          x: x,
          y: y,
          width: Math.min(cropFrame.width / imageTransform.scale, selectedImage.naturalWidth - x),
          height: Math.min(cropFrame.height / imageTransform.scale, selectedImage.naturalHeight - y)
        };
      }

      function hideCropEditor() {
        cropEditor.classList.remove('is-visible');
        document.body.classList.remove('is-cropping');
        cropGesture = null;
        cropCanvas.classList.remove('is-moving', 'is-resizing', 'is-drawing', 'is-adjusting');
      }

      function cancelCrop() {
        hideCropEditor();
        selectedImage = null;
        clearCropImage();
        imageFile.value = '';
        setOcrStatus('已取消图片识别');
        fileButton.focus();
      }

      function extractRecognitionRows(text) {
        var rows = [];
        String(text || '').replace(/，/g, ',').replace(/[。·]/g, '.').split(/\r?\n/).forEach(function (line) {
          var matches = line.match(/-?(?:\d[\d,]*\.?\d*|\.\d+)/g) || [];
          var values = matches.map(function (value) { return value.replace(/,$/, ''); }).filter(function (value) {
            return value && Number.isFinite(Number(value.replace(/,/g, '')));
          });
          if (values.length >= 2) rows.push({ amount: values[0], quantity: values[1] });
        });
        return rows;
      }

      async function getOcrWorker() {
        await loadOcrLibrary();
        if (!ocrWorker) {
          ocrWorker = await window.Tesseract.createWorker('eng', 1, {
            logger: function (message) {
              if (message.status === 'recognizing text') {
                setOcrStatus('正在识别 ' + Math.round(message.progress * 100) + '%');
              } else if (message.status) {
                setOcrStatus('正在准备识别组件…');
              }
            }
          });
          await ocrWorker.setParameters({
            tessedit_char_whitelist: '0123456789.,-',
            tessedit_pageseg_mode: '6',
            preserve_interword_spaces: '1'
          });
        }
        return ocrWorker;
      }

      function loadImage(file) {
        return new Promise(function (resolve, reject) {
          var imageUrl = URL.createObjectURL(file);
          var image = new Image();
          image.onload = function () {
            URL.revokeObjectURL(imageUrl);
            resolve(image);
          };
          image.onerror = function () {
            URL.revokeObjectURL(imageUrl);
            reject(new Error('图片加载失败'));
          };
          image.src = imageUrl;
        });
      }

      async function recognizeAndFill(file, image) {
        imageFile.disabled = true;
        cropRecognizeButton.disabled = true;
        cancelCropButton.disabled = true;
        fileButton.classList.add('is-loading');
        fileButton.textContent = '正在识别…';
        setOcrStatus('正在加载识别组件…');
        try {
          image = image || await loadImage(file);
          var worker = await getOcrWorker();
          var result = await worker.recognize(getRecognitionCanvas(image, crop));
          var rows = extractRecognitionRows(result.data.text);
          if (!rows.length) {
            setOcrStatus('没有识别到完整的两列数字，请选择更清晰的图片重试', 'error');
            return;
          }
          applyRecognizedValues(rows);
        } catch (error) {
          setOcrStatus('识别失败，请检查网络连接后重试', 'error');
          console.error(error);
        } finally {
          imageFile.disabled = false;
          imageFile.value = '';
          fileButton.classList.remove('is-loading');
          fileButton.textContent = '选择图片';
          hideCropEditor();
          selectedImage = null;
          clearCropImage();
          cropRecognizeButton.disabled = false;
          cancelCropButton.disabled = false;
        }
      }

      function applyRecognizedValues(rows) {
        var fillCount = Math.min(rows.length, ROW_COUNT);
        for (var i = 0; i < fillCount; i += 1) {
          var amountField = fields[i * 2];
          var quantityField = fields[i * 2 + 1];
          amountField.value = rows[i].amount.replace(/,/g, '');
          quantityField.value = rows[i].quantity.replace(/,/g, '');
          normalizeAmount(amountField);
        }
        updateSummary();
        setOcrStatus('识别完成：第 1 列已填金额，第 2 列已填数量，共填入 ' + fillCount + ' 行' + (rows.length > fillCount ? '，其余 ' + (rows.length - fillCount) + ' 行超出表格未填入' : ''), 'success');
      }

      function focusNext() {
        var current = document.activeElement;
        var index = fields.indexOf(current);
        if (index < 0) index = activeFieldIndex;
        if (current && current.type === 'text' && index % 2 === 0) normalizeAmount(current);
        updateSummary();
        if (index + 1 < fields.length) {
          activeFieldIndex = index + 1;
          fields[index + 1].focus();
          fields[index + 1].select();
        } else {
          current.blur();
        }
      }

      fields.forEach(function (input, index) {
        input.addEventListener('focus', function () { activeFieldIndex = index; });
        input.addEventListener('input', updateSummary);
        input.addEventListener('blur', function () {
          if (index % 2 === 0) normalizeAmount(input);
          updateSummary();
        });
        input.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === 'Tab') {
            event.preventDefault();
            focusNext();
          }
        });
      });

      confirmButton.addEventListener('click', focusNext);
      cropCanvas.addEventListener('pointerdown', startCropAction);
      cropCanvas.addEventListener('pointermove', moveCropAction);
      cropCanvas.addEventListener('pointerup', endCropAction);
      cropCanvas.addEventListener('pointercancel', endCropAction);
      cancelCropButton.addEventListener('click', cancelCrop);
      cropRecognizeButton.addEventListener('click', function () {
        if (!selectedImage) return;
        crop = getSourceCrop();
        hideCropEditor();
        setOcrStatus('裁剪完成，正在准备识别…');
        recognizeAndFill(null, selectedImage);
      });
      imageFile.addEventListener('change', function () {
        var file = imageFile.files && imageFile.files[0];
        if (!file) return;
        if (!file.type.match(/^image\//)) {
          setOcrStatus('请选择图片文件', 'error');
          imageFile.value = '';
          return;
        }
        setOcrStatus('正在打开图片…');
        loadImage(file).then(function (image) {
          selectedImage = image;
          clearCropImage();
          cropImageUrl = URL.createObjectURL(file);
          cropImage.onload = function () {
            cropImage.classList.add('is-ready');
            cropEditor.classList.add('is-visible');
            document.body.classList.add('is-cropping');
            window.requestAnimationFrame(function () {
              layoutCropEditor(true);
              cropRecognizeButton.focus();
            });
            setOcrStatus('调整裁剪区域后点击“完成”');
          };
          cropImage.src = cropImageUrl;
        }).catch(function () {
          setOcrStatus('图片加载失败，请重试', 'error');
          selectedImage = null;
          clearCropImage();
          imageFile.value = '';
        });
      });
      clearButton.addEventListener('click', function () {
        fields.forEach(function (input) { input.value = ''; });
        updateSummary();
        fields[0].focus();
      });
      window.addEventListener('beforeunload', function () {
        if (ocrWorker) ocrWorker.terminate();
        clearCropImage();
      });
      window.addEventListener('resize', function () {
        if (cropEditor.classList.contains('is-visible')) layoutCropEditor(false);
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && cropEditor.classList.contains('is-visible')) cancelCrop();
      });

      updateSummary();
    }());
  </script>
</body>
</html>
